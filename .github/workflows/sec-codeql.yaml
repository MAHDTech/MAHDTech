---
name: CodeQL

on:
  push:
    branches:
      - trunk
      - main
  pull_request:
    branches:
      - trunk
      - main
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: sec-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------
  # CodeQL Analysis
  # -------------------------------------------------
  codeql:
    name: CodeQL Analysis
    uses: tars-cloud/actions/.github/workflows/consumer-codeql.yaml@822009e983b73316cbf67a3606842502c7be4599 # v3.3.0
    with:
      languages: '["actions", "rust"]'
