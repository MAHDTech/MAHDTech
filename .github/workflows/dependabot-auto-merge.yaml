---
name: Dependabot Auto-Merge

on:
  pull_request:
    branches:
      - trunk

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------
  # Approve and Enable Auto-Merge
  # -------------------------------------------------
  auto-merge:
    name: Approve and Enable Auto-Merge
    # The approval alone merges nothing: the ruleset's required status
    # checks gate the merge, so auto-merge waits for CI to pass.
    # Checking the actor as well skips runs where someone else pushed to a
    # Dependabot branch, so only Dependabot's own commits get approved.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: approve_and_auto_merge
        name: Approve and Enable Auto-Merge
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "${PR_URL}"
          gh pr merge --auto --squash "${PR_URL}"
