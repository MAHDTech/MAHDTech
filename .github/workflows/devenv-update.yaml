---
name: Devenv Update

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch: {}

concurrency:
  group: devenv-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Update Devenv Dependencies
    uses: tars-cloud/actions/.github/workflows/consumer-devenv-update.yaml@66eaed79bdbbb12ecbc98d3a50b6ab58b289b19b # v3.13.2
    with:
      cleanup-android: true
      cleanup-dotnet: true
      cleanup-haskell: true
      cleanup-boost: true
      cleanup-swift: true
    secrets:
      client-id: ${{ secrets.APP_CLIENT_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
