---
name: "Consumer: Cargo CRAP"

on:
  pull_request:
    branches:
      - trunk
      - main
  push:
    branches:
      - trunk
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: cargo-crap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------
  # Cargo CRAP Analysis
  # -------------------------------------------------
  cargo-crap:
    name: Cargo CRAP
    uses: tars-cloud/actions/.github/workflows/consumer-cargo-crap.yaml@822009e983b73316cbf67a3606842502c7be4599 # v3.3.0
    with:
      baseline-branch: trunk
      coverage-tool: llvm-cov
      post-comment: true
      update-records-pr: false
