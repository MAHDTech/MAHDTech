---
name: CI

on:
  pull_request: {}
  push:
    branches:
      - trunk
      - main

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------
  # Consumer Devenv CI
  # -------------------------------------------------
  ci:
    name: Consumer CI - ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - AMD64
          - ARM64
    uses: tars-cloud/actions/.github/workflows/consumer-devenv-ci.yaml@822009e983b73316cbf67a3606842502c7be4599 # v3.3.0
    with:
      runner-architecture: ${{ matrix.architecture }}
      lint-command: prek run --all-files
