---
name: CI

on:
  pull_request:
    branches:
      - trunk
      - main
  push:
    branches:
      - trunk
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: CI Validation
    uses: tars-cloud/actions/.github/workflows/consumer-devenv-ci.yaml@0739d57927859d7ba35c4d9a923957565d08d2b4 # v3.13.0
    with:
      job-name: validate
      lint-command: prek run --all-files
      test-command: cargo test --workspace && ./tests/e2e_runner.sh --all
      cleanup-android: true
      cleanup-dotnet: true
      cleanup-haskell: true
      cleanup-boost: true
      cleanup-swift: true
