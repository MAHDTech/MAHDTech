---
name: SecOps

on:
  push:
    branches:
      - trunk
      - main
  pull_request:
    branches:
      - trunk
      - main
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: secops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------
  # Trivy Scan
  # -------------------------------------------------
  trivy:
    name: Trivy Scan
    uses: tars-cloud/actions/.github/workflows/consumer-trivy.yaml@68bf7f5eb020c47825bd5510eee164ef11fbcf9d # v3.14.0
    with:
      timeout-minutes: 60
      config-file: auto
      cleanup-android: true
      cleanup-dotnet: true
      cleanup-haskell: true
      cleanup-boost: true
      cleanup-swift: true

  # -------------------------------------------------
  # CodeQL Analysis
  # -------------------------------------------------
  codeql:
    name: CodeQL Analysis
    uses: tars-cloud/actions/.github/workflows/consumer-codeql.yaml@66eaed79bdbbb12ecbc98d3a50b6ab58b289b19b # v3.13.2
    with:
      type: devenv
      timeout-minutes: 120
      languages: '["actions", "rust"]'
      config-file: auto
      cleanup-android: true
      cleanup-dotnet: true
      cleanup-haskell: true
      cleanup-boost: true
      cleanup-swift: true
