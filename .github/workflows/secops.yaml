---
name: SecOps

on:
  push:
    branches:
      - trunk
      - main
  pull_request:
    branches:
      - trunk
      - main
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  security-events: write

concurrency:
  group: secops-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # -------------------------------------------------
  # Trivy Scan
  # -------------------------------------------------
  trivy:
    name: Trivy Scan
    uses: tars-cloud/actions/.github/workflows/trivy.yaml@e237e0ca8fbf31df927e9418d6b94dd81a462a35 # v4.0.0
    with:
      timeout-minutes: 60
    secrets:
      TARS_CLOUD_S3_ACCESS_KEY: ${{ secrets.TARS_CLOUD_S3_ACCESS_KEY }}
      TARS_CLOUD_S3_SECRET_ACCESS_KEY: ${{ secrets.TARS_CLOUD_S3_SECRET_ACCESS_KEY }}

  # -------------------------------------------------
  # CodeQL Analysis
  # -------------------------------------------------
  codeql:
    name: CodeQL Analysis
    uses: tars-cloud/actions/.github/workflows/codeql.yaml@e237e0ca8fbf31df927e9418d6b94dd81a462a35 # v4.0.0
    with:
      type: devenv
      languages: '["actions", "rust"]'
    secrets:
      TARS_CLOUD_S3_ACCESS_KEY: ${{ secrets.TARS_CLOUD_S3_ACCESS_KEY }}
      TARS_CLOUD_S3_SECRET_ACCESS_KEY: ${{ secrets.TARS_CLOUD_S3_SECRET_ACCESS_KEY }}
