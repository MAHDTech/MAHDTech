---
name: Rust Release

on:
  push:
    branches:
      - trunk
      - main
  workflow_dispatch:
    inputs:
      recover-pending:
        description: Retry the pending approved release using this workflow revision.
        type: boolean
        default: false

concurrency:
  group: rust-release
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  candidate:
    name: Resolve Release Candidate
    uses: tars-cloud/actions/.github/workflows/rust-release-candidate.yaml@e237e0ca8fbf31df927e9418d6b94dd81a462a35 # v4.0.0
    with:
      commit-sha: ${{ github.sha }}
      recover-pending: ${{ inputs.recover-pending || false }}

  prepare:
    name: Prepare Release PR
    needs: candidate
    if: needs.candidate.outputs.prepare-ready == 'true'
    uses: tars-cloud/actions/.github/workflows/rust-release-prepare.yaml@e237e0ca8fbf31df927e9418d6b94dd81a462a35 # v4.0.0
    with:
      commit-sha: ${{ github.sha }}
    secrets:
      client-id: ${{ secrets.CI_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  artifacts:
    name: Describe Release Artifacts
    needs: candidate
    if: needs.candidate.outputs.release-ready == 'true'
    runs-on: ubuntu-24.04
    steps:
      - id: manifest
        name: Write the Explicit Empty Asset Manifest
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
          RELEASE_TAG: ${{ needs.candidate.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.candidate.outputs.commit-sha }}
        run: |
          printf '{"schema":1,"version":"%s","tag":"%s","commit_sha":"%s","assets":[],"reference_artifacts":[]}\n' \
            "$RELEASE_VERSION" "$RELEASE_TAG" "$RELEASE_COMMIT" > release-manifest.json

      - id: upload
        name: Upload the Release Manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish:
    name: Publish Rust Release
    needs:
      - candidate
      - artifacts
    if: needs.candidate.outputs.release-ready == 'true'
    permissions:
      contents: write
      pull-requests: read
      actions: read
    uses: tars-cloud/actions/.github/workflows/rust-release-publish.yaml@e237e0ca8fbf31df927e9418d6b94dd81a462a35 # v4.0.0
    with:
      commit-sha: ${{ needs.candidate.outputs.commit-sha }}
      recovery: ${{ needs.candidate.outputs.recovery == 'true' }}
    secrets:
      client-id: ${{ secrets.CI_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  resume:
    name: Prepare Next Release After Recovery
    needs:
      - candidate
      - publish
    if: needs.candidate.outputs.recovery == 'true'
    uses: tars-cloud/actions/.github/workflows/rust-release-prepare.yaml@e237e0ca8fbf31df927e9418d6b94dd81a462a35 # v4.0.0
    with:
      commit-sha: ${{ github.sha }}
    secrets:
      client-id: ${{ secrets.CI_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
